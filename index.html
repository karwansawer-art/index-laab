<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>براوسەری وێب</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe id="myIframe" src="https://laabrah.web.app">
        براوسەرەکەت پشتگیری iframe ناکات.
    </iframe>

    <script>
        // ئەم بەشە بۆ کۆنتڕۆڵکردنی مێژووی گەڕانەوەیە
        window.onpopstate = function(event) {
            var iframe = document.getElementById('myIframe');
            if (iframe.contentWindow.history.length > 1) {
                iframe.contentWindow.history.back();
                history.pushState(null, null, window.location.href);
            }
        };

        history.pushState(null, null, window.location.href);
    </script>
</body>
</html>
