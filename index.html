<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>براوسەری وێب</title>
    <style>
        /* دڵنیابوونەوە لەوەی هیچ بۆشاییەک لە پەڕەکەدا نییە */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* ڕێگری لە دەرکەوتنی سکڕۆڵبار لە پەڕەی سەرەکی */
        }
        /* iframe بۆ ئەوەی تەواوی شاشەکە داگیر بکات */
        iframe {
            width: 100%;
            height: 100%;
            border: none; /* لابردنی چوارچێوەی iframe */
        }
    </style>
</head>
<body>
    <!-- دانانی ماڵپەڕی داواکراو لەناو iframe -->
    <iframe src="https://laabrah.web.app">
        براوسەرەکەت پشتگیری iframe ناکات.
    </iframe>
</body>
</html>
